<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duckey Command Console</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="console">

        <h1>🦆 DUCKEY COMMAND CONSOLE</h1>

        <div id="output">
            <p>Duckey Console v1.0</p>
            <p>Type <span>/help</span> for commands.</p>
        </div>

        <div id="field">
            <div id="fieldTitle">DUCK FIELD</div>
        </div>

        <div class="input-line">
            <span>&gt;</span>
            <input id="commandInput" type="text" autofocus>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
